name: Publish bilibili-cli

# 发布策略（维护者手册见 docs/bilibili-cli/RELEASE.md）：
# - main 每次提交都会进入本工作流；package.json 版本尚未发布时才构建、验收并发布。
# - 版本已存在 → 快速跳过（npm 同版本不可覆盖）；发版 = 在 PR 中提升 version 后合并。
# - 手动触发 dry_run 只构建验收，不发布。
# - 发布使用 npm trusted publishing（GitHub OIDC），不需要 NPM_TOKEN；tarball 附带 provenance。
# - npm 侧先按 docs/bilibili-cli/RELEASE.md 绑定 Trusted Publisher：workflow 文件名必须是 bilibili-cli-release.yml。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建与验收，不发布"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-bilibili-cli
  cancel-in-progress: false

env:
  PACKAGE_DIR: packages/bilibili-cli
  NODE_VERSION: "22"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ${{ env.PACKAGE_DIR }}/package-lock.json

      - name: Read package identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./${PACKAGE_DIR}/package.json').name")"
          VERSION="$(node -p "require('./${PACKAGE_DIR}/package.json').version")"
          if [ "${NAME}" != "@yukariyukaro/bilibili-cli" ]; then
            echo "包名异常：${NAME}" >&2
            exit 1
          fi
          node -e 'const v=process.argv[1]; if(!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(v)) { console.error("版本不是语义版本："+v); process.exit(1) }' "${VERSION}"
          echo "name=${NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Check registry
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          NAME='${{ steps.identity.outputs.name }}'
          VERSION='${{ steps.identity.outputs.version }}'
          EXISTS=false
          for i in 1 2 3; do
            if npm view "${NAME}@${VERSION}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
              EXISTS=true
              break
            fi
            sleep $((i * 5))
          done
          DRY='${{ inputs.dry_run }}'
          BUILD=false
          PUBLISH=false
          if [ "${EXISTS}" = "false" ] || [ "${DRY}" = "true" ]; then BUILD=true; fi
          if [ "${EXISTS}" = "false" ] && [ "${DRY}" != "true" ]; then PUBLISH=true; fi
          echo "exists=${EXISTS}" >> "${GITHUB_OUTPUT}"
          echo "build=${BUILD}" >> "${GITHUB_OUTPUT}"
          echo "publish=${PUBLISH}" >> "${GITHUB_OUTPUT}"
          echo "registry 已存在=${EXISTS}；本次构建=${BUILD}；本次发布=${PUBLISH}"

      - name: Install build toolchain
        if: steps.gate.outputs.build == 'true'
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        if: steps.gate.outputs.build == 'true'
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm run typecheck

      - name: Offline end-to-end regression
        if: steps.gate.outputs.build == 'true'
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          CI: "true"
        run: npm test

      - name: Build release directory
        if: steps.gate.outputs.build == 'true'
        id: build
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/release/bilibili-cli"
          node "${PACKAGE_DIR}/scripts/build.mjs" "${OUT}"
          echo "out=${OUT}" >> "${GITHUB_OUTPUT}"

      - name: Pack tarball
        if: steps.gate.outputs.build == 'true'
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/release"
          npm pack "${{ steps.build.outputs.out }}" --pack-destination "${DEST}" --json > "${DEST}/pack.json"
          FILE="$(node -p "require('${DEST}/pack.json')[0].filename")"
          echo "tarball=${DEST}/${FILE}" >> "${GITHUB_OUTPUT}"
          echo "Packed ${FILE}"

      - name: Assert tarball contents
        if: steps.gate.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TGZ="${{ steps.pack.outputs.tarball }}"
          LIST="$(tar -tzf "${TGZ}" | sed 's|^package/||')"
          fail() { echo "打包内容不合规：$1" >&2; exit 1; }
          echo "${LIST}" | grep -qx "dist/cli/bili.mjs" || fail "缺少 dist/cli/bili.mjs"
          echo "${LIST}" | grep -qx "cli/bili.mjs" || fail "缺少兼容入口 cli/bili.mjs"
          echo "${LIST}" | grep -qx "package.json" || fail "缺少 package.json"
          echo "${LIST}" | grep -qx "SKILL.md" || fail "缺少 SKILL.md"
          for bad in src/ test/ scripts/ tsconfig.json; do
            if echo "${LIST}" | grep -q "^${bad}"; then fail "包含 ${bad}"; fi
          done
          if echo "${LIST}" | grep -qE '\.(m?ts|map)$'; then fail "包含 TypeScript 或 sourcemap"; fi
          if echo "${LIST}" | grep -qE '(^|/)node_modules/'; then fail "包含 node_modules"; fi
          for state in bili_credential.json config.json audit.jsonl; do
            if echo "${LIST}" | grep -qE "(^|/)${state}$"; then fail "包含用户状态 ${state}"; fi
          done

      - name: Smoke test from tarball
        if: steps.gate.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TGZ="${{ steps.pack.outputs.tarball }}"
          WORK="${RUNNER_TEMP}/smoke"
          mkdir -p "${WORK}"
          cd "${WORK}"
          export BILIBILI_SKILL_HOME="${WORK}/state"
          VERSION="$(npm exec --yes --package "${TGZ}" -- bilibili --version)"
          echo "smoke version: ${VERSION}"
          [ "${VERSION}" = "${{ steps.identity.outputs.version }}" ] || { echo "版本不一致" >&2; exit 1; }
          npm exec --yes --package "${TGZ}" -- bilibili doctor --json
          for probe in "${WORK}/bili_credential.json" "${WORK}/state/bili_credential.json" "${WORK}/state/audit.jsonl"; do
            [ ! -e "${probe}" ] || { echo "冒烟测试产生了用户状态：${probe}" >&2; exit 1; }
          done

      # Trusted publishing 需要 npm >= 11.5.1；GitHub 自带 npm 可能更旧。
      - name: Ensure npm supports trusted publishing
        if: steps.gate.outputs.publish == 'true'
        run: npm install -g npm@^11.15.0

      # 不带 NODE_AUTH_TOKEN：npm 在 GitHub Actions 里自动使用 OIDC，
      # 前提是 npm 包设置中已绑定本仓库的 bilibili-cli-release.yml。
      - name: Publish to npm via trusted publishing
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm publish "${{ steps.pack.outputs.tarball }}" --registry https://registry.npmjs.org/ --access public --provenance

      - name: Verify published version
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.identity.outputs.version }}"
          for i in $(seq 1 20); do
            if npm view "@yukariyukaro/bilibili-cli@${VERSION}" version >/dev/null 2>&1; then
              echo "已可解析：${VERSION}"
              npm view @yukariyukaro/bilibili-cli dist-tags --json
              exit 0
            fi
            echo "等待 registry 索引（${i}/20）…"
            sleep 30
          done
          echo "超时：registry 仍不可解析 ${VERSION}（可能仍在自动审核）" >&2
          exit 1

      - name: Upload tarball
        if: steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bilibili-cli-${{ steps.identity.outputs.version }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: warn
          retention-days: 14

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "### bilibili-cli 发布"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | ${{ steps.identity.outputs.version }} |"
            echo "| registry 已存在 | ${{ steps.gate.outputs.exists }} |"
            echo "| 本次发布 | ${{ steps.gate.outputs.publish }} |"
            echo ""
            echo "main 每次提交都会触发本工作流；只有 package.json 版本尚未发布时才真正发包。"
            echo "发版方式：在 PR 中提升 ${{ env.PACKAGE_DIR }}/package.json 的 version，合并到 main 后自动发布。"
          } >> "${GITHUB_STEP_SUMMARY}"
